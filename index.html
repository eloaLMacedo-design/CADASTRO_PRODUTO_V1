
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="titulo">
            <img id="foto-perfil" src="eloooooo.jpg" alt="Minha foto">
            <h1>Cadastro de produtos</h1>
        </div>

        <!-- Formulário de entrada e edição -->
        <form id="produto-form" novalidate>

            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex. Notebook"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    min="0.01"
                    placeholder="Ex. 3500.00"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    step="1"
                    min="1"
                    placeholder="Ex. 5"
                    required
                >
            </div>

            <div class="botoes-formulario">
                <button type="submit" id="btn-salvar" class="btn-primary">
                    Adicionar ao carrinho
                </button>

                <button
                    type="button"
                    id="btn-cancelar-edicao"
                    class="btn-cancelar"
                    hidden
                >
                    Cancelar edição
                </button>
            </div>

        </form>

        <!-- Cabeçalho de ações e resumo -->
        <div class="resumo-container">

            <h3 id="total-estoque">
                Total em estoque: R$ 0,00
            </h3>

            <button type="button" id="limpar-tabela" class="btn-danger">
                Limpar tudo
            </button>

        </div>

        <!-- Tabela de exibição -->
        <div class="tabela-container">

            <table id="tabela-produtos">

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço-un</th>
                        <th>Quant.</th>
                        <th>Sub-total</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- As linhas serão criadas pelo JavaScript -->
                </tbody>

            </table>

        </div>

        <p id="mensagem-vazia" hidden>
            Nenhum produto cadastrado ainda.
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
